# Render blueprint.
#
# Spec 9 wants the worker as its own service so a heavy job never blocks an
# HTTP request. Render does not offer a free instance type for background
# workers - they start at $7/month - so the free configuration runs the worker
# in-process on the web service instead, and the separate service below is
# commented out ready for the upgrade.
#
# In-process is genuinely workable here rather than a fudge. The queue lives in
# Postgres, so nothing is lost while the instance sleeps: the GitHub Actions
# cron wakes the service, the worker thread starts with it and drains whatever
# accumulated. The cost is that a large analysis competes for CPU with the API
# on a small instance, which shows up as a sluggish request rather than a
# failed one.
#
# Secrets are marked sync:false, so Render prompts for them rather than reading
# them from this file. Nothing sensitive belongs in the repository.

services:
  - type: web
    name: busylab-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Run the worker in this process. Set to "0" only once the separate
      # worker service below is running, or nothing will claim jobs at all.
      - key: BUSYLAB_INLINE_WORKER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      # The deployed frontend origin. A trailing slash breaks the match.
      - key: BUSYLAB_CORS
        sync: false
      - key: BUSYLAB_SCHEDULER_TOKEN
        sync: false
      # Optional. Without it the engine's own wording is used.
      - key: GROQ_API_KEY
        sync: false
      # Digest delivery. These live here because the worker runs here. Move
      # them to the worker service if you split it out.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Fallback recipient. Each dataset can carry its own instead.
      - key: BUSYLAB_DIGEST_TO
        sync: false

